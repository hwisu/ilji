[package]
name = "ilji"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local search over Codex, Claude Code, OpenCode and pi session history, served over MCP"
license = "MIT"
repository = "https://github.com/hwisu/ilji"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
regex = "1.13.1"
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
walkdir = "2.5.0"
zstd = "0.14.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
